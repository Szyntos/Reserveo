services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reserveo
      POSTGRES_USER: reserveo
      POSTGRES_PASSWORD: reserveo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
